# Cloudflare Flexible: HTTPS terminates at Cloudflare; origin traffic is HTTP.
server {
    listen 80;
    server_name mcp.738ngx.site;
    access_log off;
    location = /wanderlog/mcp {
        proxy_pass http://127.0.0.1:18747/mcp;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 45s;
    }
    location / { return 404; }
}
